name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run test suite
        run: go test -race ./...
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
